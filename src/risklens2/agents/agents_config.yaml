version: 1.0.0
agents:
  memo_agent: 
    name: Credit Memo Agent
    role: Generate a credit Memo based on the company information provided by the other agents
    llm_model: "gpt-5"
    llm_temprature: 0
    inputs: 
      - company_profile
      - financial_analysis
      - policy_assesment
      - industry_analysis
      - media_analysis
    output:
      - credit_memo

  company_research_agent:
    name: Company Research Agent
    role: To fetch company data from companies house which includes company profile, director details, psc details, charges details and insolvency details.

  media_agent:
    name: Media Search Agent
    role: To search for adverse media info about the company and its directors
    
    llm_model: "gpt-5"
    llm_temprature: 0
    
    tavily:
      max_results: 5
      topic: "news"
      search_depth: "advanced"
      exact_match: True
    
    jev_model: "jev-latest"

    inputs:
      - company_name
      - company_number
      - directors_list

  industry_intelligence_agent:
    name: Industry Intelligence Agent
    role: To search for Industry outlook, regulatory considerations, insolvency trends, key risks and macroeconomic senstivity from multiple external sources

    tavily:
      max_results: 5
      topic: "general"
      search_depth: "basic"
      include_domains: ["gov.uk", "ons.gov.uk", "bankofengland.co.uk", "fca.org.uk", "pwc.com", "deloitte.com", "ey.com", "kpmg.com"]
      threshold: 0.4
    
    llm:
      model: "gpt-5"
      temprature: 0
      