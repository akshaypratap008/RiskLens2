version: 1.0.0
rag:
  name: credit_policy_rag
  chunker:
    strategy: "hybrid"
    
    hybrid:
      max_tokens: 400
      merge_peers: true
      repeat_table_header: true
  
  vector_store:
    chromadb:
      collection_name: credit_policy
      persistant_dir: data/artifacts/chroma_db
      embedding_model: text-embedding-3-small
      collection_configuration:
        hnsw:
          space: "cosine"

  retriever:
    top_k: 20

  evals:
    goldens_folder_path: src\risklens2\credit_policy_rag\evals\goldens
    eval_results_folder_path: src\risklens2\credit_policy_rag\evals\eval_results
    retriever_eval:
      dataset_name : credit_policy_extract_goldens.json
      eval_metrics_parameters: 
        threshold: 0.7
        model: "gpt-4.1-mini"
        include_reason: true
  
  reranker:
    top_k: 5
    model: "BAAI/bge-reranker-base" 

  generator:
    provider: "OpenAI"
    model: "gpt-4o-mini"
      

