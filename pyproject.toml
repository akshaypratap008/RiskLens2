[project]
name = "risklens2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "apaks", email = "ap.akshay008@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "dotenv-python>=0.0.1",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
risklens2 = "risklens2:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
